[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-sbfl"
version = "0.1.0"
description = "Spectrum-based fault localization for VLA trajectory coverage"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0,<2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vla_sbfl*"]

